<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NU Result Checker</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="header-content">

      <div class="logo">

        <div class="logo-icon">
          🎓
        </div>

        <div>

          <h1>
            NU Result Checker
          </h1>

          <p>
            National University Bangladesh
          </p>

        </div>

      </div>

    </div>

  </header>


  <!-- MAIN CONTENT -->
  <main class="container">


    <!-- SEARCH CARD -->
    <section class="search-card">

      <div class="card-title">

        <h2>
          Check Your Result
        </h2>

        <p>
          Enter your examination information
        </p>

      </div>


      <!-- RESULT FORM -->
      <form id="resultForm">


        <!-- EXAMINATION -->
        <div class="form-group">

          <label for="exam">
            Examination
          </label>

          <select
            id="exam"
            required
          >

            <option value="2204">
              Bachelor Degree (Honours) 4th Year
            </option>

          </select>

        </div>


        <!-- ROLL -->
        <div class="form-group">

          <label for="roll">
            Exam Roll
          </label>

          <input
            type="text"
            id="roll"
            placeholder="Enter Exam Roll"
            required
          >

        </div>


        <!-- REGISTRATION -->
        <div class="form-group">

          <label for="registration">
            Registration Number
          </label>

          <input
            type="text"
            id="registration"
            placeholder="Enter Registration Number"
            required
          >

        </div>


        <!-- EXAM YEAR -->
        <div class="form-group">

          <label for="year">
            Exam Year
          </label>

          <input
            type="number"
            id="year"
            value="2024"
            placeholder="Example: 2024"
            required
          >

        </div>


        <!-- SEARCH BUTTON -->
        <button
          type="submit"
          id="searchButton"
        >

          <span id="buttonText">
            Search Result
          </span>

          <span
            id="loader"
            class="loader hidden"
          ></span>

        </button>


      </form>

    </section>


    <!-- MESSAGE -->
    <div
      id="message"
      class="message hidden"
    ></div>


    <!-- RESULT SECTION -->
    <section
      id="resultSection"
      class="result-card hidden"
    >


      <!-- RESULT HEADER -->
      <div class="result-header">

        <div>

          <h2>
            Official Result Sheet
          </h2>

          <p>
            Result information from National University
          </p>

        </div>


        <button
          class="print-btn"
          onclick="window.print()"
        >
          🖨 Print
        </button>

      </div>


      <!-- OFFICIAL RESULT -->
      <div
        id="officialResult"
        class="official-result"
      >

      </div>


      <!-- RESULT FOOTER -->
      <div class="result-footer">

        <p>
          Result retrieved from National University Result Server.
        </p>

      </div>


    </section>


  </main>


  <!-- FOOTER -->
  <footer>

    <div class="footer-content">

      <p>
        © 2026 NU Result Checker
      </p>

      <p>
        Independent Result Checking Interface
      </p>

    </div>

  </footer>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>

</html>
